asset_composition_report_schedule:
  timezone: Asia/Tehran
  calendar: jalali
  policy:
    reminder_start_offset_days: 5
    repeat_every_days_until_updated: 1
    stop_condition: asset_composition_as_of >= expected_report_period_end
    note: Publication dates may vary month to month. The bot should start checking
      after the fund-specific report period end and keep reminding until the asset-composition
      record is updated.
